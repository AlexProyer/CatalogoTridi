backend:
  name: github
  repo: AlexProyer/CatalogoTridi
  branch: main
  base_url: https://tridi-decap-proxy.alexbuitrago156.workers.dev
  auth_endpoint: /auth

# Cloudflare construye el sitio automáticamente con cada commit que
# guarda este panel — no hace falta hacer nada más para publicar.
publish_mode: simple

media_folder: public/images/uploads
public_folder: /images/uploads

locale: es

collections:
  - name: categories
    label: Categorías
    label_singular: Categoría
    folder: content/categories
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: name
    fields:
      - { label: Nombre, name: name, widget: string }
      - { label: Imagen de portada, name: img, widget: image }
      - { label: Color de acento, name: accent, widget: color }
      - { label: Orden de aparición, name: order, widget: number, value_type: int }
      - label: Productos
        name: products
        widget: list
        summary: '{{name}} — {{price}}'
        fields:
          - { label: Código, name: code, widget: string, required: false }
          - { label: Nombre, name: name, widget: string }
          - { label: 'Tamaño (ej: "15 cm")', name: size, widget: string }
          - { label: 'Precio (ej: "$35,000")', name: price, widget: string }
          - { label: 'Peso (ej: "120 g")', name: weight, widget: string }
          - { label: Material, name: material, widget: string }
          - { label: Foto principal, name: img, widget: image }
          - label: Fotos adicionales
            name: extraImgs
            widget: list
            required: false
            field: { label: Foto, name: img, widget: image }
          - label: Colores disponibles
            name: colors
            widget: list
            required: false
            summary: '{{name}}'
            fields:
              - { label: Nombre del color, name: name, widget: string }
              - { label: Color, name: hex, widget: color }
          - { label: Descripción, name: desc, widget: text, required: false }

  - name: settings
    label: Configuración del sitio
    files:
      - name: company
        label: Datos de la empresa
        file: content/settings/company.json
        fields:
          - { label: Nombre, name: name, widget: string }
          - { label: Subtítulo, name: sub, widget: string }
          - { label: Teléfono, name: phone, widget: string }
          - { label: Instagram, name: instagram, widget: string }
          - { label: Sitio web, name: website, widget: string }
          - { label: Año del catálogo, name: year, widget: string }
          - { label: 'Tiempo de entrega (ej: "3 – 5 días hábiles")', name: delivery, widget: string }
          - { label: 'WhatsApp (solo números, con código de país, ej: "573174271275")', name: whatsapp, widget: string, pattern: ['^\d{10,15}$', 'Solo números, con código de país, sin +, espacios ni guiones'] }
